apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealership-web
  template:
    metadata:
      labels:
        app: dealership-web
    spec:
      containers:
        - name: django
          image: YOUR_REGISTRY/dealership-web:latest
          ports:
            - containerPort: 8000
          env:
            - name: backend_url
              value: http://dealership-api:3030
            - name: sentiment_analyzer_url
              value: http://sentiment-analyzer:5050
            - name: DJANGO_DEBUG
              value: "false"
            - name: DJANGO_SECRET_KEY
              value: SET_A_PRIVATE_SECRET_IN_CLUSTER
            - name: DJANGO_ALLOWED_HOSTS
              value: SET_TO_THE_PUBLIC_HOSTNAME
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-web
spec:
  selector:
    app: dealership-web
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealership-api
  template:
    metadata:
      labels:
        app: dealership-api
    spec:
      containers:
        - name: express
          image: YOUR_REGISTRY/dealership-api:latest
          ports:
            - containerPort: 3030
          env:
            - name: MONGO_URL
              value: mongodb://mongo:27017/dealershipsDB
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-api
spec:
  selector:
    app: dealership-api
  ports:
    - port: 3030
      targetPort: 3030
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentiment-analyzer
  template:
    metadata:
      labels:
        app: sentiment-analyzer
    spec:
      containers:
        - name: sentiment
          image: YOUR_REGISTRY/sentiment-analyzer:latest
          ports:
            - containerPort: 5050
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-analyzer
spec:
  selector:
    app: sentiment-analyzer
  ports:
    - port: 5050
      targetPort: 5050
