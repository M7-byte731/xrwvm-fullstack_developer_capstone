<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dealerships</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <style>
    :root{--ink:#17212b;--blue:#075b75;--aqua:#75d6d2;--paper:#f3f7f8;--line:#dce6e9}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,sans-serif}
    header{background:var(--aqua);box-shadow:0 2px 8px #1232}.nav{max-width:1160px;margin:auto;min-height:72px;padding:12px 22px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
    .brand{font-size:24px;font-weight:700;color:var(--ink);text-decoration:none;margin-right:18px}.nav a{color:#123b47;text-decoration:none}.nav a:hover{text-decoration:underline}.spacer{flex:1}.user{font-weight:700}
    main{max-width:1160px;margin:30px auto;padding:0 20px}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 4px 16px #16323d0d}.hero{display:flex;align-items:center;gap:28px}.hero img{width:min(44%,440px);border-radius:8px;object-fit:cover}.hero h1{font-size:32px;color:var(--blue)}
    h1,h2{color:var(--blue)}.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:12px 0 18px;flex-wrap:wrap}.toolbar select,.field input,.field textarea{padding:10px;border:1px solid #aabcc2;border-radius:6px;font:inherit}.table-wrap{overflow:auto;background:white;border-radius:10px;box-shadow:0 4px 16px #16323d0d}.table{margin:0;min-width:760px}.table th{background:#e5f4f4}.table td,.table th{vertical-align:middle}.review-link,.button{display:inline-block;border:0;border-radius:6px;background:var(--blue);color:#fff!important;padding:10px 16px;text-decoration:none;cursor:pointer;font:inherit}.button:hover,.review-link:hover{background:#06475b;text-decoration:none}.field{display:grid;gap:6px;margin:14px 0}.field input,.field textarea{width:100%;box-sizing:border-box}.form{max-width:560px;margin:26px auto}.message{margin-top:12px;color:#a32121}.review-card{border:1px solid var(--line);padding:18px;border-radius:9px;background:#fff;margin:14px 0}.review-card img{width:28px;height:28px;vertical-align:middle;margin-right:10px}.muted{color:#53636a}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    @media(max-width:700px){.nav{gap:14px}.brand{width:100%}.hero{display:block}.hero img{width:100%;margin-bottom:14px}.hero h1{font-size:26px}.spacer{display:none}main{margin:18px auto}}
  </style>
</head>
<body>
  <header><nav class="nav"><a class="brand" href="/">Dealerships</a><a href="/">Home</a><a href="/about">About Us</a><a href="/contact">Contact Us</a><span class="spacer"></span><span id="account"></span></nav></header>
  <main id="app"><p>Loading…</p></main>
  <script>
    const app=document.getElementById('app');
    const account=document.getElementById('account');
    const username=()=>sessionStorage.getItem('username');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function nav(){account.innerHTML=username()?`<span class="user">${esc(username())}</span> &nbsp; <a href="#" id="logout">Logout</a>`:'<a href="/login">Login</a> &nbsp; <a href="/register">Register</a>';const b=document.getElementById('logout');if(b)b.onclick=async e=>{e.preventDefault();await fetch('/djangoapp/logout');sessionStorage.clear();location.href='/dealers'};}
    async function get(url){const r=await fetch(url);let d;try{d=await r.json()}catch{throw Error('The server returned an unreadable response.')}if(!r.ok)throw Error(d.error||d.status||`Request failed (${r.status})`);return d}
    function showError(e){app.innerHTML=`<section class="panel"><h2>Could not load this page</h2><p class="message">${esc(e.message||e)}</p><p>Check that the Django, dealership API, and sentiment services are running.</p></section>`}
    async function dealers(state){try{const d=await get('/djangoapp/get_dealers'+(state?'/'+encodeURIComponent(state):''));const rows=d.dealers||[];const states=[...new Set(rows.map(x=>x.state).filter(Boolean))].sort();app.innerHTML=`<h1>Dealerships</h1><div class="toolbar"><span>Browse dealership locations and select a dealer for details.</span><label>Filter by state: <select id="state"><option value="">All states</option>${states.map(s=>`<option ${s===state?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select></label></div><div class="table-wrap"><table class="table table-striped"><thead><tr><th>ID</th><th>Dealer Name</th><th>City</th><th>Address</th><th>ZIP</th><th>State</th>${username()?'<th>Review Dealer</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.id)}</td><td><a href="/dealer/${encodeURIComponent(x.id)}">${esc(x.full_name)}</a></td><td>${esc(x.city)}</td><td>${esc(x.address)}</td><td>${esc(x.zip)}</td><td>${esc(x.state)}</td>${username()?`<td><a class="review-link" href="/postreview/${encodeURIComponent(x.id)}">Post Review</a></td>`:''}</tr>`).join('')}</tbody></table></div>`;document.getElementById('state').onchange=e=>location.href=e.target.value?'/dealers/'+encodeURIComponent(e.target.value):'/dealers';}catch(e){showError(e)}}
    async function dealer(id){try{const [d,r]=await Promise.all([get('/djangoapp/dealer/'+id),get('/djangoapp/reviews/dealer/'+id)]);const x=Array.isArray(d.dealer)?d.dealer[0]:d.dealer;app.innerHTML=`<section class="panel"><div class="actions"><h1>${esc(x.full_name)}</h1>${username()?`<a class="review-link" href="/postreview/${id}">Post Review</a>`:''}</div><p>${esc(x.city)}, ${esc(x.address)}, ZIP ${esc(x.zip)}, ${esc(x.state)}</p><h2>Customer Reviews</h2>${(r.reviews||[]).length?(r.reviews||[]).map(v=>{const sentiment=v.sentiment||'neutral';const icon=sentiment==='positive'?'/static/positive.png':sentiment==='negative'?'/static/negative.png':'/static/neutral.png';return `<article class="review-card"><img src="${icon}" alt="${esc(sentiment)} sentiment"><strong>${esc(v.name||'Customer')}</strong><p>${esc(v.review)}</p><div class="muted">${esc(v.car_make)} ${esc(v.car_model)} · ${esc(v.car_year)} · ${esc(v.purchase_date)}</div></article>`}).join(''):'<p>No reviews yet.</p>'}</section>`}catch(e){showError(e)}}
    async function login(){app.innerHTML=`<section class="panel form"><h1>Login</h1><form id="login-form"><label class="field">Username<input name="userName" autocomplete="username" required></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label><div class="actions"><button class="button">Login</button><a href="/register">Create an account</a></div><p class="message" id="message"></p></form></section>`;document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const m=document.getElementById('message');try{const r=await fetch('/djangoapp/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(!r.ok||d.status!=='Authenticated')throw Error('Username or password is incorrect. If you do not have an account yet, choose Register.');sessionStorage.setItem('username',d.userName);location.href='/dealers'}catch(x){m.textContent=x.message}}}
    async function register(){app.innerHTML=`<section class="panel form"><h1>Create an account</h1><form id="register-form"><label class="field">Username<input name="userName" required autocomplete="username"></label><label class="field">First name<input name="firstName" required></label><label class="field">Last name<input name="lastName" required></label><label class="field">Email<input name="email" type="email" required></label><label class="field">Password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="button">Register</button><p class="message" id="message"></p></form></section>`;document.getElementById('register-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const m=document.getElementById('message');try{const r=await fetch('/djangoapp/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(!r.ok)throw Error(d.status||'Registration failed');sessionStorage.setItem('username',d.userName);sessionStorage.setItem('firstname',f.get('firstName'));sessionStorage.setItem('lastname',f.get('lastName'));location.href='/dealers'}catch(x){m.textContent=x.message}}}
    async function postReview(id){if(!username()){location.href='/login';return}try{const [d,c]=await Promise.all([get('/djangoapp/dealer/'+id),get('/djangoapp/get_cars')]);const x=Array.isArray(d.dealer)?d.dealer[0]:d.dealer;const cars=c.CarModels||[];app.innerHTML=`<section class="panel form"><h1>Post a review</h1><h2>${esc(x.full_name)}</h2><form id="review-form"><label class="field">Review<textarea name="review" rows="5" required></textarea></label><label class="field">Purchase date<input type="date" name="purchase_date" required></label><label class="field">Car make and model<select name="car" required><option value="">Choose a car</option>${cars.map(v=>`<option value="${esc(v.CarMake)}|${esc(v.CarModel)}">${esc(v.CarMake)} ${esc(v.CarModel)}</option>`).join('')}</select></label><label class="field">Car year<input type="number" name="car_year" min="2015" max="2026" required></label><button class="button">Post Review</button><p class="message" id="message"></p></form></section>`;document.getElementById('review-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const [make,model]=f.get('car').split('|');const payload={name:sessionStorage.getItem('firstname')?`${sessionStorage.getItem('firstname')} ${sessionStorage.getItem('lastname')}`:username(),dealership:id,review:f.get('review'),purchase:true,purchase_date:f.get('purchase_date'),car_make:make,car_model:model,car_year:f.get('car_year')};try{const r=await fetch('/djangoapp/add_review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const v=await r.json();if(!r.ok||v.status!==200)throw Error(v.error||'Could not post review');location.href='/dealer/'+id}catch(z){document.getElementById('message').textContent=z.message}}}catch(e){showError(e)}}
    async function home(){try{const d=await get('/djangoapp/get_dealers');app.innerHTML=`<section class="hero"><img src="/static/car_dealership.jpg" alt="Car dealership"><div><h1>Welcome to our Dealerships!</h1><p>Browse dealership locations, explore customer reviews, and share your own experience.</p><a class="button" href="/dealers">View Dealerships (${(d.dealers||[]).length})</a></div></section>`}catch(e){showError(e)}}
    async function start(){nav();const p=decodeURI(location.pathname);if(p==='/login')return login();if(p==='/register')return register();if(p==='/dealers'||p==='/')return dealers('');if(p.startsWith('/dealers/'))return dealers(p.slice('/dealers/'.length));const m=p.match(/^\/dealer\/(\d+)\/?$/);if(m)return dealer(m[1]);const q=p.match(/^\/postreview\/(\d+)\/?$/);if(q)return postReview(q[1]);if(p==='/')return home();return dealers('')}
    start();
  </script>
</body>
</html>
