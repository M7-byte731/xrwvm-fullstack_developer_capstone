services:
  mongo_db:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  express:
    build: .
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      MONGO_URL: mongodb://mongo_db:27017/dealershipsDB
    depends_on:
      - mongo_db
  sentiment:
    build: ../djangoapp/microservices
    restart: unless-stopped
    ports:
      - "5050:5050"
  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo_db:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo_db
volumes:
  mongo_data:
